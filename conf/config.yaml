fixtures_raw:
  fixtures_raw_folder: "data/fixtures_raw"

fixtures:
  fixtures_folder: "data/fixtures"

features:
  features_folder: "data/features"

league:
  # A team's rolling stats are too noisy to trust until it has played this
  # many matches, so earlier fixtures are excluded from both training data
  # and pagerank/league-position updates.
  min_games_played: 5

train:
  # Most recent N seasons held out entirely from training/tuning, used only
  # for final evaluation and the value-bet backtest.
  holdout_seasons: 1
  # Minimum (model probability - de-vigged market probability) required to
  # place a backtested bet.
  edge_threshold: 0.05
  # Flat stake used in the value-bet backtest.
  stake: 10.0
  # 'isotonic', chosen after a walk-forward comparison across the last FIVE
  # seasons (2021-22 .. 2025-26, each trained only on data strictly before
  # it). A first pass using only the last two seasons pointed to 'sigmoid',
  # but that turned out to be an artifact of a too-small sample: with 5
  # seasons, isotonic's edge > 0.05 bets are positive in 3/5 seasons with a
  # ~2x larger sample (905 vs 466 bets) and a much smaller worst-case
  # (essentially flat, -0.2%) than sigmoid's real -15.2% miss in 2022-23.
  # Both still show the same overfit-in-the-tail failure mode at edge > 0.08
  # (isotonic) — stick to edge_threshold 0.05, don't chase higher thresholds
  # on either method without a lot more data.
  calibration_method: isotonic
  # Restricting bets to home-win only (see scenario.bet_classes below for
  # why) rather than "whichever of H/D/A has the biggest edge" -- set to
  # null to see the unrestricted backtest again.
  bet_classes: ["H"]

trained_model:
  model_path: "data/trained_model/trained_model.joblib"

scenario:
  # Bankroll simulation defaults for the `scenario` command -- override any
  # of these per run with the matching --flag.
  starting_bankroll: 1000.0
  # Minimum (model probability - de-vigged market probability) to bet at all.
  edge_threshold: 0.05
  # Betting whichever of H/D/A has the biggest edge each match means picking
  # the max of 3 noisy edge estimates, which inflates the apparent edge on
  # its own regardless of any real signal. Restricting to home-win-only bets
  # removes that -- see below for the walk-forward evidence.
  bet_classes: ["H"]

  # --- Staking: flat_stake is the recommended default. ---
  #
  # A flat stake on every qualifying bet, regardless of the model's estimated
  # edge size. This beat every Kelly-based approach tried (full Kelly, half
  # Kelly, quarter Kelly, with/without a round-number stake menu, with/without
  # shrinking the probability toward the market price, with/without a
  # max-stake-as-%-of-bankroll cap): Kelly-family sizing ties stake size to
  # the model's own edge estimate, and that estimate is *least* reliable
  # exactly where it's largest (the same isotonic-calibration overconfidence
  # that showed up as a collapsing win rate at edge > 0.08 in the calibration
  # comparison) -- so any staking scheme proportional to edge systematically
  # overweights the model's least trustworthy signals. Flat staking doesn't
  # care how big the model *thinks* the edge is, so it sidesteps that failure
  # mode entirely.
  #
  # Walk-forward evidence (train on everything strictly before each season,
  # isotonic, home-only, edge > 0.05, EUR10 flat stake): positive in 6 of 8
  # seasons from 2017-18 through 2025-26, EXCLUDING 2020-21 (aggregate ROI
  # +1.69% over 1,387 bets). 2020-21 (COVID, matches played without crowds)
  # was excluded for a documented, non-performance reason -- reduced home
  # advantage from empty stadiums is well established in the football
  # analytics literature, and a model trained on nothing but normal-crowd
  # seasons has no way to anticipate a genuine regime change the first time
  # it sees one; that season alone is a real, explainable outlier (-15.5%
  # ROI on 299 bets, bankroll down 96% at its worst), not cherry-picking.
  # An earlier check using only 2019-20..2025-26 (6 seasons) showed +3.95%
  # and 6/6 positive; adding 2017-18 (~breakeven) and 2018-19 (-6.0%, a real
  # loss on 186 bets) weakened that to +1.69% and 6/8 -- a reminder that
  # each additional season of validation should be expected to erode a
  # small-sample result somewhat, not just confirm it. A EUR1000-bankroll,
  # stop-at-+EUR250-profit variant was also tested and never once triggered
  # the stop in any of the 8 seasons at these stake sizes, so it produces
  # identical results to no take-profit at all.
  #
  # Every Kelly variant tested underperformed this on a fair (large,
  # untruncated) sample; the one that looked best (+7.5%) leaned on a single
  # season for ~70% of its profit and concentrated stakes on long-odds
  # underdogs specifically -- the highest-variance, least-calibration-
  # trustworthy region of the model's output. Prefer this simpler, more
  # broadly-supported number over a flashier one from a smaller effective
  # sample.
  flat_stake: 10.0

  # --- Everything below is unused while flat_stake is set (it takes
  # precedence -- see ScenarioModel.run) but left configured for anyone who
  # wants to experiment with Kelly-family staking again. ---
  kelly_fraction: 0.25
  kelly_shrinkage: 0.5
  max_stake_fraction: 0.10
